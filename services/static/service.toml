schema = 2
description = "Serves a self-contained 80|20 component demonstration"
entrypoint = "service.ts"

[lifecycle]
default_enabled = false
service_type = "stateless"
session_keep_alive = "10m"

[scaling]
minimum_workers = 8
maximum_workers = 1000
concurrency_per_worker = 32
target_utilization = 0.70
worker_keep_alive = "2m"

[placement]
sandbox_group = ""
minimum_sandboxes = 2
workers_per_sandbox = 50

[openapi]
title = "Static Demo Site"
version = "1.0.0"
description = "Static HTML and local browser assets served through the 80|20 runtime"
